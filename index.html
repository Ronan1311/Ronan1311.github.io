<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ma collection de maillots</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👕</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;700&family=Archivo:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#edeee8;--ink:#16202e;--muted:#5d6675;--card:#fbfbf8;--line:#d4d6cf;--accent:#c8102e;--ph:#dfe2da}
@media (prefers-color-scheme:dark){:root{--bg:#10151d;--ink:#eceee8;--muted:#9aa3b2;--card:#182030;--line:#2a3445;--accent:#ff4a63;--ph:#212b3d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Archivo,system-ui,sans-serif}
header{padding:56px 24px 24px;max-width:1200px;margin:auto}
h1{font:700 clamp(40px,8vw,88px)/.95 "Archivo Narrow",sans-serif;margin:0;letter-spacing:-.01em}
.stats{display:flex;gap:32px;margin-top:20px;color:var(--muted)}
.stats b{display:block;font:700 28px "Archivo Narrow",sans-serif;color:var(--ink)}
.bar{max-width:1200px;margin:auto;padding:0 24px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:0;background:var(--bg);z-index:5;padding-top:12px;border-bottom:1px solid var(--line)}
.bar button,.bar select{font:600 14px Archivo,sans-serif;border:1.5px solid var(--ink);background:transparent;color:var(--ink);padding:7px 14px;border-radius:999px;cursor:pointer}
.bar button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.bar select{margin-left:auto;border-radius:6px;background:var(--bg)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{max-width:1200px;margin:auto;padding:24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden;cursor:pointer;text-align:left;padding:0;color:inherit;font:inherit}
.photo{position:relative;aspect-ratio:4/5;background:var(--ph)}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .3s}
.photo img.back{opacity:0}
.card:hover .back,.card:focus-visible .back{opacity:1}
.tag{position:absolute;top:10px;left:10px;background:var(--accent);color:#fff;font:700 13px "Archivo Narrow",sans-serif;padding:2px 9px;border-radius:3px;z-index:2}
.body{padding:12px 14px 14px}
.body h2{font:700 19px/1.15 "Archivo Narrow",sans-serif;margin:0 0 6px}
.row{display:flex;justify-content:space-between;color:var(--muted);font-size:14px}
.stars{color:var(--accent);letter-spacing:2px}
.empty,.err{grid-column:1/-1;padding:40px;text-align:center;color:var(--muted)}
dialog{border:none;border-radius:8px;padding:0;max-width:760px;width:calc(100% - 32px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.m-photos{display:grid;grid-template-columns:1fr 1fr}
.m-photos .photo{aspect-ratio:4/5}.m-photos img{position:absolute;inset:0;opacity:1}
.m-info{padding:20px 24px 24px}
.m-info h2{font:700 28px "Archivo Narrow",sans-serif;margin:0 0 12px}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 20px;margin:0}
dt{color:var(--muted)}dd{margin:0;font-weight:600}
.close{position:absolute;top:10px;right:10px;z-index:3;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;font-size:18px;cursor:pointer}
@media(max-width:520px){.m-photos{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>Ma collection<br>de maillots</h1>
  <div class="stats" id="stats"></div>
</header>
<nav class="bar" id="filtres" aria-label="Filtres"></nav>
<main id="galerie" aria-live="polite"></main>
<dialog id="modale"><button class="close" aria-label="Fermer">✕</button><div id="modale-contenu"></div></dialog>

<script>
const PLACEHOLDER = "data:image/svg+xml;utf8," + encodeURIComponent(
  "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 100'><rect width='80' height='100' fill='#c9cdc4'/><path d='M25 20 L10 32 L18 46 L26 42 L26 82 L54 82 L54 42 L62 46 L70 32 L55 20 Q40 32 25 20Z' fill='#e9ebe4'/></svg>");

class MaillotDTO {
  constructor(d) { Object.assign(this, d); }
  obtenirFlocageComplet() {
    const n = [this.flocageNom, this.flocageNumero || ""].join(" ").trim();
    return n || "Sans flocage";
  }
  formatterPrix() {
    return new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR" }).format(this.prix);
  }
}

class ChargeurAPI {
  constructor(url) { this.url = url; }
  async fetchMaillots() {
    const r = await fetch(this.url);
    if (!r.ok) throw new Error("HTTP " + r.status);
    return (await r.json()).map(d => new MaillotDTO(d));
  }
}

class GestionnaireFiltres {
  filtrerParCategorie(cat, liste) { return cat === "Tous" ? liste : liste.filter(m => m.categorie === cat); }
  trier(liste, mode) {
    const l = [...liste];
    if (mode === "prix-asc") l.sort((a, b) => a.prix - b.prix);
    if (mode === "prix-desc") l.sort((a, b) => b.prix - a.prix);
    if (mode === "note") l.sort((a, b) => b.noteSur5 - a.noteSur5);
    return l;
  }
}

class GenerateurInterface {
  constructor(galerie, modale) { this.galerie = galerie; this.modale = modale; }
  img(src, alt, cls = "") {
    const i = document.createElement("img");
    i.src = src; i.alt = alt; i.loading = "lazy"; i.className = cls;
    i.onerror = () => { i.onerror = null; i.src = PLACEHOLDER; };
    return i;
  }
  etoiles(n) { return "★".repeat(n) + "☆".repeat(5 - n); }
  construireCarteMaillot(m) {
    const c = document.createElement("button");
    c.className = "card";
    c.setAttribute("aria-label", "Voir le détail : " + m.info);
    const p = document.createElement("div"); p.className = "photo";
    p.innerHTML = `<span class="tag"></span>`;
    p.firstChild.textContent = m.categorie;
    p.append(this.img(m.photoAvant, m.info + " – face"), this.img(m.photoArriere, m.info + " – dos", "back"));
    const b = document.createElement("div"); b.className = "body";
    b.innerHTML = `<h2></h2><div class="row"><span class="fl"></span><span class="pr"></span></div><div class="stars" aria-label="Note ${m.noteSur5} sur 5"></div>`;
    b.querySelector("h2").textContent = m.info;
    b.querySelector(".fl").textContent = m.obtenirFlocageComplet();
    b.querySelector(".pr").textContent = m.formatterPrix();
    b.querySelector(".stars").textContent = this.etoiles(m.noteSur5);
    c.append(p, b);
    c.onclick = () => this.afficherDetailModale(m);
    return c;
  }
  afficherGalerie(liste) {
    this.galerie.replaceChildren();
    if (!liste.length) { this.galerie.innerHTML = '<p class="empty">Aucun maillot dans cette catégorie.</p>'; return; }
    liste.forEach(m => this.galerie.append(this.construireCarteMaillot(m)));
  }
  afficherDetailModale(m) {
    const z = document.getElementById("modale-contenu");
    z.replaceChildren();
    const ph = document.createElement("div"); ph.className = "m-photos";
    for (const [s, a] of [[m.photoAvant, "face"], [m.photoArriere, "dos"]]) {
      const d = document.createElement("div"); d.className = "photo";
      d.append(this.img(s, m.info + " – " + a)); ph.append(d);
    }
    const inf = document.createElement("div"); inf.className = "m-info";
    const h = document.createElement("h2"); h.textContent = m.info;
    const dl = document.createElement("dl");
    const lignes = [["Catégorie", m.categorie], ["Flocage", m.obtenirFlocageComplet()],
      ["Lieu d'achat", m.lieuAchat], ["Prix", m.formatterPrix()], ["Note", this.etoiles(m.noteSur5) + " (" + m.noteSur5 + "/5)"]];
    lignes.forEach(([k, v]) => { const t = document.createElement("dt"), e = document.createElement("dd"); t.textContent = k; e.textContent = v; dl.append(t, e); });
    inf.append(h, dl); z.append(ph, inf);
    this.modale.showModal();
  }
}

class ApplicationWeb {
  constructor() {
    this.chargeur = new ChargeurAPI("data/maillots.json");
    this.ui = new GenerateurInterface(document.getElementById("galerie"), document.getElementById("modale"));
    this.filtres = new GestionnaireFiltres();
    this.cat = "Tous"; this.tri = "defaut"; this.maillots = [];
  }
  async initialiserPage() {
    const modale = document.getElementById("modale");
    modale.querySelector(".close").onclick = () => modale.close();
    modale.addEventListener("click", e => { if (e.target === modale) modale.close(); });
    try {
      this.maillots = await this.chargeur.fetchMaillots();
    } catch (e) {
      document.getElementById("galerie").innerHTML =
        '<p class="err">Impossible de charger data/maillots.json. Si tu ouvres le fichier directement, lance un petit serveur local (ex. <code>npx serve</code>).</p>';
      return;
    }
    this.afficherStats();
    this.construireBarre();
    this.rafraichir();
  }
  afficherStats() {
    const total = this.maillots.reduce((s, m) => s + m.prix, 0);
    const cats = new Set(this.maillots.map(m => m.categorie)).size;
    document.getElementById("stats").innerHTML =
      `<div><b>${this.maillots.length}</b>maillots</div><div><b>${cats}</b>catégories</div><div><b>${new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(total)}</b>investis</div>`;
  }
  construireBarre() {
    const nav = document.getElementById("filtres");
    const cats = ["Tous", ...new Set(this.maillots.map(m => m.categorie))];
    cats.forEach(c => {
      const b = document.createElement("button");
      b.textContent = c; b.setAttribute("aria-pressed", c === this.cat);
      b.onclick = () => { this.cat = c; nav.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); this.rafraichir(); };
      nav.append(b);
    });
    const s = document.createElement("select"); s.setAttribute("aria-label", "Trier");
    s.innerHTML = '<option value="defaut">Ordre de la collection</option><option value="prix-asc">Prix croissant</option><option value="prix-desc">Prix décroissant</option><option value="note">Meilleures notes</option>';
    s.onchange = () => { this.tri = s.value; this.rafraichir(); };
    nav.append(s);
  }
  rafraichir() {
    const l = this.filtres.trier(this.filtres.filtrerParCategorie(this.cat, this.maillots), this.tri);
    this.ui.afficherGalerie(l);
  }
}
new ApplicationWeb().initialiserPage();
</script>
</body>
</html>
